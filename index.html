<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>svg-filter-matrix</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <div class="row">
        <section class="container input">
          <h3>Input</h3>
          <div class="import">
            <label for="fileInput" d-ref="dropzone">
              <input type="file" d-ref="import" id="fileInput" accept="image/*" />
              <div class="placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-up-icon lucide-image-up"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19.5 3-3 3 3"/><path d="M17 22v-5.5"/><circle cx="9" cy="9" r="2"/></svg>
                <p>
                  Add images by clicking or dragging them here
                </p>
                <p>
                  Supported formats: <strong>JPEG, JPG</strong>
                <br>
                  Maximum file size per image: <strong>75 MB</strong>
                </p>
              </div>
            </label>
              <img d-ref="input-img" src="" alt="input image" style="filter: url(#convolve)" />
          </div>
          <div class="file-actions">
            <button d-ref="delete" class="btn-secondary" disabled>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-trash2-icon lucide-trash-2"
              >
                <path d="M10 11v6" />
                <path d="M14 11v6" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                <path d="M3 6h18" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
              Remove Image
            </button>
            <button d-ref="reset" class="btn-secondary" disabled>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"
              >
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              Reset Filters
            </button>
          </div>
        </section>

        <section class="container operator">
          <h3>Operator</h3>
          <div class="preset">
            <label for="preset">Filter Preset:</label>
            <select name="preset" d-ref="preset" id="preset" disabled>
              <option value="custom" disabled>Custom</option>
              <option value="identity" selected>Identity</option>
              <option value="blurGaussian">Gaussian Blur</option>
              <option value="blurBox">Box Blur</option>
              <option value="edgeSobelX">Sobel X</option>
              <option value="edgeSobelY">Sobel Y</option>
              <option value="edgeLaplace">Laplace</option>
              <option value="sharpen">Sharpen</option>
              <option value="emboss">Emboss</option>
            </select>
          </div>
          <div class="matrix" d-ref="matrix">
            <input type="number" disabled />
            <input type="number" disabled />
            <input type="number" disabled />

            <input type="number" disabled />
            <input type="number" disabled />
            <input type="number" disabled />

            <input type="number" disabled />
            <input type="number" disabled />
            <input type="number" disabled />
          </div>
          <div class="filter-actions">
            <button d-ref="apply" class="btn-primary" disabled>Apply Filter</button>
            <button d-ref="undo" class="btn-secondary" disabled>Undo Last</button>
          </div>
        </section>

        <section class="container history">
          <h3>Filter History</h3>
          <div class="filter-info">
            <span>Filters applied: <strong d-ref="filter-count">0</strong>/8</span>
          </div>

          <div class="history-list">
            <p class="history-empty">No filters applied yet</p>
            <ol class="history-items" d-ref="history-list">
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>

    <svg>
      <filter id="convolve">
        <feConvolveMatrix
          d-ref="matrix-1"
          order="3"
          kernelMatrix="
              1 2 1
              2 4 2
              1 2 1
            "
          divisor="16"
        />
      </filter>
    </svg>
  </body>
</html>
