<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff3366' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M3 9h18'/><path d='M3 15h18'/><path d='M9 3v18'/><path d='M15 3v18'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Filter Matrix</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <div class="app-brand">
          <svg
            class="app-logo"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <use href="#icon-grid" />
          </svg>
          <div>
            <h1>Filter Matrix</h1>
            <p>Real-time image convolution</p>
          </div>
        </div>
      </header>

      <div class="app-layout">
        <section class="panel panel-image">
          <div class="panel-header">
            <h3>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                <circle cx="9" cy="9" r="2" />
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
              </svg>
              Input
            </h3>
            <div class="file-actions">
              <button d-ref="download" class="btn-ghost btn-download" disabled title="Download Image">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 17V3" />
                  <path d="m6 11 6 6 6-6" />
                  <path d="M19 21H5" />
                </svg>
              </button>
              <button d-ref="delete" class="btn-ghost" disabled title="Remove Image">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M10 11v6" />
                  <path d="M14 11v6" />
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                  <path d="M3 6h18" />
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
              </button>
              <button d-ref="reset" class="btn-ghost" disabled title="Reset All Filters">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
              </button>
            </div>
          </div>
          <div class="import">
            <label for="fileInput" d-ref="dropzone">
              <input type="file" d-ref="import" id="fileInput" accept="image/*" />
              <div class="placeholder">
                <div class="placeholder-icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="40"
                    height="40"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"
                    />
                    <path d="m14 19.5 3-3 3 3" />
                    <path d="M17 22v-5.5" />
                    <circle cx="9" cy="9" r="2" />
                  </svg>
                </div>
                <p class="placeholder-title">Drop an image here</p>
                <p class="placeholder-sub">or click to browse &middot; JPEG, PNG up to 75 MB</p>
              </div>
            </label>
            <img d-ref="input-img" src="" alt="input image" style="filter: url(#convolve)" />
            <div class="bake-overlay" d-ref="bake-overlay"></div>
          </div>
        </section>

        <aside class="sidebar">
          <section class="panel panel-operator">
            <div class="panel-header">
              <h3>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 20h9" />
                  <path
                    d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"
                  />
                </svg>
                Operator
              </h3>
              <div class="mode-switcher">
                <input type="radio" name="op-mode" id="mode-conv" d-ref="mode-conv" checked class="sr-only" />
                <label for="mode-conv" class="mode-btn" title="Convolution">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <use href="#icon-grid" />
                  </svg>
                </label>
                <input type="radio" name="op-mode" id="mode-adj" d-ref="mode-adj" class="sr-only" />
                <label for="mode-adj" class="mode-btn" title="Adjustments">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M4 21v-7" />
                    <path d="M4 10V3" />
                    <path d="M12 21v-9" />
                    <path d="M12 8V3" />
                    <path d="M20 21v-5" />
                    <path d="M20 12V3" />
                    <circle cx="4" cy="12" r="2" />
                    <circle cx="12" cy="10" r="2" />
                    <circle cx="20" cy="14" r="2" />
                  </svg>
                </label>
              </div>
            </div>

            <div class="operator-body">
              <div class="section-convolution" d-ref="section-convolution">
                <div class="preset">
                  <label for="preset">Kernel Preset</label>
                  <select name="preset" d-ref="preset" id="preset" disabled>
                    <option value="custom" disabled>Custom</option>
                    <option value="identity" selected>Identity</option>
                    <option value="blurGaussian">Gaussian Blur</option>
                    <option value="blurBox">Box Blur</option>
                    <option value="edgeSobelX">Sobel X</option>
                    <option value="edgeSobelY">Sobel Y</option>
                    <option value="edgeLaplace">Laplace</option>
                    <option value="sharpen">Sharpen</option>
                    <option value="emboss">Emboss</option>
                  </select>
                </div>
                <div class="matrix-wrapper">
                  <div class="matrix" d-ref="matrix">
                    <input type="number" disabled />
                    <input type="number" disabled />
                    <input type="number" disabled />
                    <input type="number" disabled />
                    <input type="number" disabled />
                    <input type="number" disabled />
                    <input type="number" disabled />
                    <input type="number" disabled />
                    <input type="number" disabled />
                  </div>
                </div>
              </div>

              <div class="section-adjustments" d-ref="section-adjustments">
                <div class="adj-slider">
                  <div class="adj-slider-header">
                    <label for="adj-gray">Grayscale</label>
                    <span class="adj-value" d-ref="adj-gray-val">0%</span>
                  </div>
                  <input type="range" id="adj-gray" d-ref="adj-gray" min="0" max="100" step="5" value="0" disabled />
                </div>
                <div class="adj-slider adj-slider--r">
                  <div class="adj-slider-header">
                    <label for="adj-r">Red</label>
                    <span class="adj-value" d-ref="adj-r-val">100%</span>
                  </div>
                  <input type="range" id="adj-r" d-ref="adj-r" min="0" max="200" step="5" value="100" disabled />
                </div>
                <div class="adj-slider adj-slider--g">
                  <div class="adj-slider-header">
                    <label for="adj-g">Green</label>
                    <span class="adj-value" d-ref="adj-g-val">100%</span>
                  </div>
                  <input type="range" id="adj-g" d-ref="adj-g" min="0" max="200" step="5" value="100" disabled />
                </div>
                <div class="adj-slider adj-slider--b">
                  <div class="adj-slider-header">
                    <label for="adj-b">Blue</label>
                    <span class="adj-value" d-ref="adj-b-val">100%</span>
                  </div>
                  <input type="range" id="adj-b" d-ref="adj-b" min="0" max="200" step="5" value="100" disabled />
                </div>
                <div class="adj-slider">
                  <div class="adj-slider-header">
                    <label for="adj-contrast">Contrast</label>
                    <span class="adj-value" d-ref="adj-contrast-val">100%</span>
                  </div>
                  <input
                    type="range"
                    id="adj-contrast"
                    d-ref="adj-contrast"
                    min="0"
                    max="200"
                    step="5"
                    value="100"
                    disabled
                  />
                </div>
              </div>
            </div>
            <!-- /.operator-body -->

            <div class="filter-actions">
              <button d-ref="apply" class="btn-primary" disabled>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
                Apply
              </button>
              <button d-ref="undo" class="btn-secondary" disabled>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 14 4 9l5-5" />
                  <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
                </svg>
                Undo
              </button>
            </div>
          </section>

          <section class="panel panel-history">
            <div class="panel-header">
              <h3>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                  <path d="M12 7v5l4 2" />
                </svg>
                History
              </h3>
              <span class="filter-badge"
                ><strong d-ref="filter-count">0</strong><span class="filter-badge-sep">/</span>16</span
              >
            </div>
            <div class="filter-info">
              <div class="filter-meter">
                <div class="filter-meter-fill" d-ref="filter-meter-fill"></div>
              </div>
            </div>
            <div class="history-list">
              <p class="history-empty">No filters applied yet</p>
              <ol class="history-items" d-ref="history-list"></ol>
            </div>
          </section>
        </aside>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>

    <svg style="position: absolute; width: 0; height: 0; overflow: hidden" aria-hidden="true">
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M3 9h18" />
        <path d="M3 15h18" />
        <path d="M9 3v18" />
        <path d="M15 3v18" />
      </symbol>
      <filter id="convolve">
        <feConvolveMatrix order="3" kernelMatrix="0 0 0 0 1 0 0 0 0" divisor="1" />
      </filter>
    </svg>
  </body>
</html>
